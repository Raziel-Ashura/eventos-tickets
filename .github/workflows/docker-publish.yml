name: Docker - Publicar imagenes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api-gateway/**'
      - 'ms-eventos/**'
      - 'ms-reservas/**'
      - 'ms-tickets/**'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read

jobs:
  publish:
    name: Publicar ${{ matrix.service }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - ms-eventos
          - ms-reservas
          - ms-tickets

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
