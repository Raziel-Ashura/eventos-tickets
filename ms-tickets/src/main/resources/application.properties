spring.application.name=ms-tickets
server.port=8083
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tickets_db}
spring.datasource.username=${DB_USER:eventos}
spring.datasource.password=${DB_PASSWORD:eventos_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
services.eventos.url=${EVENTOS_URL:http://localhost:8081}
services.reservas.url=${RESERVAS_URL:http://localhost:8082}
tickets.storage.path=${TICKETS_STORAGE_PATH:/app/tickets}
