server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: eventos
          uri: ${EVENTOS_URL:http://localhost:8081}
          predicates:
            - Path=/api/eventos/**
        - id: reservas
          uri: ${RESERVAS_URL:http://localhost:8082}
          predicates:
            - Path=/api/reservas/**
        - id: tickets
          uri: ${TICKETS_URL:http://localhost:8083}
          predicates:
            - Path=/api/tickets/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
